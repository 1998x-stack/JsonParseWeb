name: v0.3 M04-A/B visible index + worker quality gates
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/app.mjs && node --check src/ui/render.mjs && node --check src/core/json.mjs
      - run: find packages/json-core src/worker src/document -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm run bench:core
      - run: npm run bench:m04
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SETTINGS_MODULE: server.config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q server manage.py
      - run: python manage.py check
      - run: pytest -q
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Chromium M03 regression (local HTTP only)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/jsonparseweb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/e2e/m03_playwright.py
