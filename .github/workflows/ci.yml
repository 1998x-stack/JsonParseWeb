name: v0.2 + v0.3 lossless core quality gates
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/app.mjs && node --check src/ui/render.mjs && node --check src/core/json.mjs
      - run: find packages/json-core -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm run bench:core
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SETTINGS_MODULE: server.config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q server manage.py
      - run: python manage.py check
      - run: pytest -q
