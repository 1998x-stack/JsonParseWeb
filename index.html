<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JSONParseWeb - 隐私优先的本地 JSON 解析、验证、浏览工作台">
  <meta name="referrer" content="no-referrer">
  <title>JSONParseWeb · JSON Developer Workbench</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="top-inner"><div><p class="eyebrow">DEVELOPER WORKBENCH · V0.2</p><h1>JSONParseWeb</h1><p class="subtitle">本地优先的 JSON 解析、验证与可视化工作台</p></div><span class="privacy">● 本地解析 · 不自动上传</span></div>
  </header>
  <main class="layout">
    <section class="panel" aria-labelledby="sourceHeading">
      <div class="panel-heading"><div><p class="eyebrow dark">01 / SOURCE</p><h2 id="sourceHeading">输入 JSON</h2></div><span class="hint">Ctrl / ⌘ + Enter</span></div>
      <label class="sr-only" for="jsonInput">JSON 文本</label>
      <textarea id="jsonInput" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='{"hello": "world", "active": true}'></textarea>
      <div class="buttonbar">
        <button class="primary" id="parseBtn">解析 JSON</button>
        <button id="formatBtn">格式化</button>
        <button id="loadSampleBtn">加载示例</button>
        <button id="clearBtn">清空</button>
      </div>
      <div class="upload" id="dropZone">
        <label for="fileInput">拖拽 .json 文件至此，或 <span>选择文件</span></label>
        <input type="file" id="fileInput" accept=".json,application/json">
        <p>文件仅在浏览器内读取 · 限制 2 MiB</p>
      </div>
    </section>
    <section class="panel" aria-labelledby="outputHeading">
      <div class="panel-heading"><div><p class="eyebrow dark">02 / RESULT</p><h2 id="outputHeading">解析结果</h2></div><button id="downloadBtn">导出原文</button></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <nav class="tabs" aria-label="展示模式"><button class="selected" data-view="tree" aria-pressed="true">树形视图</button><button data-view="raw" aria-pressed="false">原始数据</button><button data-view="table" aria-pressed="false">表格视图</button></nav>
      <div id="jsonDisplay" class="output" aria-label="JSON 解析展示"><p class="muted">解析结果将在此显示。</p></div>
      <div id="warnings" class="warnings" aria-live="polite"></div>
      <div id="stats" class="stats" hidden>
        <div><span>属性数</span><strong id="keys">0</strong></div>
        <div><span>最大深度</span><strong id="depth">0</strong></div>
        <div><span>数组</span><strong id="arrays">0</strong></div>
        <div><span>对象</span><strong id="objects">0</strong></div>
        <div><span>节点数</span><strong id="nodes">0</strong></div>
      </div>
    </section>
  </main>
  <footer>JSONParseWeb v0.2 · 默认不发送或保存数据 · <a href="./docs/architecture.md">架构说明</a></footer>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
